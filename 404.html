<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Houssam Moallem</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 80vh; text-align: center; background: var(--dark); color: #fff; }
    .error-code { font-size: 6rem; font-weight: 800; color: var(--accent); margin: 0; }
    .error-msg { font-size: 1.25rem; margin: 1rem 0 2rem; opacity: .8; }
    .btn { display: inline-block; padding: 12px 28px; background: var(--accent); color: #fff; border-radius: var(--radius); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <h1 class="error-code">404</h1>
    <p class="error-msg">This page doesn't exist. It may have moved or the link is wrong.</p>
    <a href="/" class="btn">← Back to Home</a>
  </div>
</body>
</html>
